# Project identification
sonar.projectKey=dartsmate
sonar.projectName=Dartsmate

# SonarQube server
sonar.host.url=http://localhost:9000

# Authentication via environment variable
sonar.token=${env.SONAR_TOKEN}

# Encoding
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=main,renderer

# Exclusions
sonar.exclusions=\
**/node_modules/**,\
**/.cache/**,\
**/public/**,\
**/*.jpg,\
**/*.jpeg,\
**/*.png,\
**/*.gif,\
**/*.svg,\
**/*.ico,\
**/*.webp,\
**/*.ttf,\
**/*.woff,\
**/*.woff2

# Testing
# sonar.javascript.lcov.reportPaths=coverage/lcov.info