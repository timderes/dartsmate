name: Build application on all platforms

# Keep workflow permissions minimal; `actions: write` is required by `actions/cache`
# to save npm/electron caches, while `contents` only needs read access.
permissions:
  actions: write # Needed for caching npm dependencies
  contents: read

# Cancel an outdated main build when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Check the full build after changes reach main, except for Dependabot pull
# requests, which already run the lightweight build test separately.
on:
  push:
    branches: [main]

jobs:
  identify-change:
    name: Identify Dependabot merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip-build: ${{ steps.pull-request.outputs.skip-build }}
    steps:
      - name: Check associated pull requests
        id: pull-request
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });
            const isDependabotMerge = pullRequests.some(
              pullRequest => pullRequest.user?.login === 'dependabot[bot]'
            );
            core.setOutput('skip-build', isDependabotMerge ? 'true' : 'false');

  build:
    needs: identify-change
    if: needs.identify-change.outputs.skip-build != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-script: build:linux
          - os: windows-latest
            # 32-bit (build:win32) is intentionally skipped;
            # Windows 10/11 dropped 32-bit support in 2020.
            build-script: build:win64
          - os: macos-latest
            build-script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - name: Cache Electron binaries (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Cache Electron binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron
            ${{ env.LOCALAPPDATA }}\electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      - run: npm run ${{ matrix.build-script }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ runner.os }}
          path: |
            dist/**
            release/**
            build/**
            out/**
          # Retain artifacts for 7 days to allow time for manual download and testing.
          # Then they will be automatically deleted to save storage space.
          retention-days: 7
